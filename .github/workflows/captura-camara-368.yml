name: Renderizar píldora prueba cámara 368
on:
  push:
    branches: [capturas/pildora-camara-368]
    paths:
      - tools/capturas/pills/es.py
      - tools/capturas/pills/en.py
      - .github/workflows/captura-camara-368.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del generador
        uses: actions/checkout@v4
        with:
          ref: capturas/pildora-camara-368
          path: generador
      - name: Checkout de recursos de la app 2.5 RC1
        uses: actions/checkout@v4
        with:
          ref: prerelease/v25-rc1-slim
          path: recursos
          sparse-checkout: app/src/main/res
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias y Chromium
        run: |
          python -m pip install playwright pillow babel
          python -m playwright install --with-deps chromium
      - name: Verificar píldora
        working-directory: generador
        run: python3 tools/capturas/capturas.py --list pill23 --lang=es,en
      - name: Renderizar PNG
        working-directory: generador
        env:
          RS_APP_RES: ${{ github.workspace }}/recursos/app/src/main/res
        run: python3 tools/capturas/capturas.py pill23 --lang=es,en --dry
      - name: Subir imagen
        uses: actions/upload-artifact@v4
        with:
          name: ridescreen-pildora-camara-368
          path: generador/tools/capturas/out/dry/docs/pildoras/*/23-prueba-camara-368.png
          if-no-files-found: error
